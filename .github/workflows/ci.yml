name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unixodbc-dev
      - name: Install dependencies
        run: |
          pip install -r requirements.txt || pip install pandas numpy scipy scikit-learn fastapi uvicorn pydantic pyyaml python-dotenv openpyxl pyarrow matplotlib plotly seaborn joblib tqdm pytest pytest-cov pytest-mock httpx loguru
      - name: Run tests
        run: |
          export PYTHONPATH=$PWD
          pytest tests/ -v --tb=short
      - name: Lint
        run: |
          pip install flake8
          flake8 src/ --max-line-length=100 --ignore=E501,W503,E127,E226,F401,W504

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t demand-sensing:latest .
